name: dayfocus
description: "Focus on what matters. Plan your day with intention."
publish_to: 'none'

version: 1.0.3+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.2

  # Local database
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.25

  # Auth + cloud sync
  supabase_flutter: ^2.9.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^1.0.5

  # In-app purchases
  purchases_flutter: ^10.8.0

  # Utils
  intl: ^0.20.1
  shared_preferences: ^2.3.4
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.13
  drift_dev: ^2.23.1
  custom_lint: ^0.7.5

flutter:
  uses-material-design: true
